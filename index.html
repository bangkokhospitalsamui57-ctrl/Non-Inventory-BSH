<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Non Inventory System - ระบบเบิกของใช้ฟุ่มเฟือย</title>
<style>
  :root{
    --navy:#092d74; --navy-dim:#e8edf7; --red:#b11e29; --red-dim:#fbeaec; --red-dark:#5b111e;
    --gray:#738592;
    --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --border:#dde3ea;
    --text:#182636; --text-dim:#5b6b7a;
    --accent:var(--navy); --accent-dim:var(--navy-dim);
    --danger:var(--red); --danger-dim:var(--red-dim);
    --success:#1f8a4c; --success-dim:#e7f7ee;
    --warn:#b5790a; --warn-dim:#fff3d9;
    --radius:12px; --shadow:0 1px 3px rgba(9,45,116,.10),0 1px 2px rgba(9,45,116,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141c; --surface:#171e29; --surface-2:#212a38; --border:#2c3949;
      --text:#e8edf5; --text-dim:#96a5b8;
      --navy:#5c85e6; --navy-dim:#1b2740; --red:#ff6b73; --red-dim:#3a1a1e; --red-dark:#f0a1a6;
      --gray:#93a3b3;
      --success:#4ad185; --success-dim:#123322; --warn:#ffc94d; --warn-dim:#3a2c0d;
      --shadow:0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f141c; --surface:#171e29; --surface-2:#212a38; --border:#2c3949;
    --text:#e8edf5; --text-dim:#96a5b8;
    --navy:#5c85e6; --navy-dim:#1b2740; --red:#ff6b73; --red-dim:#3a1a1e; --red-dark:#f0a1a6;
    --gray:#93a3b3;
    --success:#4ad185; --success-dim:#123322; --warn:#ffc94d; --warn-dim:#3a2c0d;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  #app{max-width:1220px;margin:0 auto;padding:14px 14px 24px;width:100%;flex:1;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-row img{height:38px;width:auto;display:block;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-weight:800;color:var(--navy);font-size:1.02rem;}
  .brand-text .sub{font-size:.72rem;color:var(--gray);letter-spacing:.06em;font-weight:700;}
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:10px 0 8px; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .session-box{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-dim);}
  .role-badge{padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800;}
  .role-badge.admin{background:var(--red-dim);color:var(--red);}
  .role-badge.user{background:var(--navy-dim);color:var(--navy);}
  .logout-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:700;cursor:pointer;}
  h1{font-size:1.05rem;margin:0 0 2px;}
  .subtitle{color:var(--text-dim);font-size:.8rem;margin:8px 0 10px;}
  nav.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:12px;}
  nav.tabs button{
    border:none;background:transparent;color:var(--text-dim);padding:8px 13px;border-radius:8px;
    font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  nav.tabs button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
  .grid-controls{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:150px;}
  .field.grow{flex:2 1 260px;}
  .field.small{flex:0 1 130px;min-width:110px;}
  label{font-size:.75rem;color:var(--text-dim);font-weight:700;}
  select, input[type="text"], input[type="number"], input[type="search"], input[type="password"], input[type="date"]{
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:9px 10px; font-size:.9rem; width:100%;
  }
  select:focus, input:focus{outline:2px solid var(--navy); outline-offset:1px;}
  .mode-switch{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;}
  .mode-switch button{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:6px;font-size:.85rem;font-weight:700;color:var(--text-dim);cursor:pointer;}
  .mode-switch button.active.withdraw{background:var(--red-dim);color:var(--red);}
  .mode-switch button.active.restock{background:var(--success-dim);color:var(--success);}
  .mode-switch button:disabled{opacity:.35;cursor:not-allowed;}

  .cat-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
  .cat-chip{
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    padding:6px 12px;border-radius:999px;font-size:.8rem;white-space:nowrap;cursor:pointer;font-weight:700;
  }
  .cat-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .product-list{display:flex;flex-direction:column;gap:8px;}
  .product-row{
    display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  }
  .p-name{font-size:.9rem;font-weight:700;}
  .p-meta{font-size:.76rem;color:var(--text-dim);margin-top:2px;}
  .p-stock{font-size:.76rem;margin-top:3px;font-weight:800;}
  .p-stock.low{color:var(--warn);}
  .p-stock.zero{color:var(--red);}
  .p-stock.ok{color:var(--success);}
  .qty-box{display:flex;align-items:center;gap:6px;}
  .qty-box button{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);font-size:1rem;cursor:pointer;line-height:1;
  }
  .qty-box input{width:56px;text-align:center;padding:6px 4px;}
  .btn{
    background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--red);}
  .btn.success{background:var(--success);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.sm{padding:6px 10px;font-size:.76rem;border-radius:7px;}
  .empty-note{color:var(--text-dim);font-size:.85rem;text-align:center;padding:24px 0;}

  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--border); box-shadow:0 -2px 10px rgba(0,0,0,.08);
  }
  .cart-bar-inner{max-width:1220px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .cart-summary{flex:1;min-width:180px;font-size:.85rem;}
  .cart-summary b{font-size:1rem;}
  .cart-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.82rem;font-weight:700;cursor:pointer;}
  .submit-btn{border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:700;cursor:pointer;color:#fff;}
  .submit-btn.withdraw{background:var(--red);}
  .submit-btn.restock{background:var(--success);}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed;}

  .cart-panel{
    position:fixed; left:0; right:0; bottom:64px; z-index:29; max-height:44vh; overflow-y:auto;
    background:var(--surface); border-top:1px solid var(--border); box-shadow:0 -2px 10px rgba(0,0,0,.08);
  }
  .cart-panel-inner{max-width:1220px;margin:0 auto;padding:10px 14px;}
  .cart-line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.85rem;}
  .cart-line:last-child{border-bottom:none;}
  .cart-line .name{flex:1;}
  .cart-line .amt{color:var(--text-dim);font-size:.78rem;}
  .cart-line button.rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;padding:2px 6px;}
  .requester-field{margin-bottom:8px;}

  table.hist, table.rep{width:100%;border-collapse:collapse;font-size:.83rem;}
  table.hist th, table.hist td, table.rep th, table.rep td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  table.hist th, table.rep th{color:var(--text-dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.02em;}
  table.rep tr.subtotal td{background:var(--surface-2);font-weight:800;}
  table.rep tr.grandtotal td{background:var(--navy-dim);font-weight:800;color:var(--navy);}
  table.rep td.num, table.hist td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;}
  .badge.withdraw{background:var(--red-dim);color:var(--red);}
  .badge.restock{background:var(--success-dim);color:var(--success);}
  .badge.status-pending{background:var(--warn-dim);color:var(--warn);}
  .badge.status-fulfilled{background:var(--success-dim);color:var(--success);}
  .badge.status-cancelled{background:var(--surface-2);color:var(--text-dim);}
  .fulfill-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .fulfill-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .fulfill-head .who{font-weight:800;font-size:.95rem;}
  .fulfill-head .meta{font-size:.78rem;color:var(--text-dim);margin-top:2px;}
  table.fulfill-items{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:10px;}
  table.fulfill-items th, table.fulfill-items td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left;}
  table.fulfill-items th{color:var(--text-dim);font-size:.7rem;text-transform:uppercase;}
  table.fulfill-items input{width:70px;padding:6px 8px;text-align:center;}
  table.fulfill-items td.short{color:var(--red);font-weight:700;}
  .fulfill-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .items-mini{color:var(--text-dim);font-size:.76rem;margin-top:2px;}
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--success); color:#fff; padding:10px 18px; border-radius:999px; font-size:.85rem;
    font-weight:700; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, top .25s;
  }
  .toast.show{opacity:1; top:20px;}
  .toast.err{background:var(--red);}
  .banner{
    background:var(--warn-dim); color:var(--warn); border:1px solid var(--warn); border-radius:10px;
    padding:8px 12px; font-size:.8rem; margin-bottom:10px;
  }
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .stat{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .stat .lbl{font-size:.72rem;color:var(--text-dim);}
  .stat .val{font-size:1.15rem;font-weight:800;margin-top:2px;}
  .row-expand{cursor:pointer;}
  .row-expand:hover{background:var(--surface-2);}
  .subrow td{background:var(--bg);}
  .edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0;}
  .wh-row{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .wh-row .top-line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .confirm-box{display:flex;align-items:center;gap:8px;background:var(--red-dim);border:1px solid var(--red);border-radius:8px;padding:6px 10px;font-size:.78rem;color:var(--red);margin-top:6px;}
  .login-page{min-height:100vh;display:flex;flex-direction:column;}
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 20px;}
  .login-card{
    width:100%;max-width:400px;background:#ffffff;border:1px solid rgba(255,255,255,.6);
    border-radius:26px;padding:36px 32px 30px;text-align:center;
    box-shadow:0 30px 70px -20px rgba(3,7,25,.65),0 0 0 1px rgba(255,255,255,.05);
  }
  .login-card img{width:190px;height:auto;margin-bottom:14px;}
  .login-card h2{font-size:1.18rem;margin:2px 0 3px;color:var(--navy);font-weight:800;}
  .login-card p.sub{font-size:.78rem;color:var(--gray);margin:0 0 16px;font-weight:600;letter-spacing:.04em;}
  .login-divider{width:70px;height:5px;border-radius:99px;margin:0 auto 22px;background:linear-gradient(90deg,var(--red) 0%,var(--red) 45%,var(--navy) 55%,var(--navy) 100%);}
  .login-field{text-align:left;margin-bottom:14px;}
  .login-field label{color:var(--navy);font-weight:700;font-size:.78rem;display:block;margin-bottom:6px;}
  .login-field input{
    padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:#f7f9fc;font-size:.92rem;
  }
  .login-field input:focus{border-color:var(--navy);background:#fff;}
  .login-err{background:var(--red-dim);color:var(--red);border-radius:10px;padding:9px 12px;font-size:.8rem;margin-bottom:12px;text-align:left;font-weight:600;}
  .login-btn{
    width:100%;background:linear-gradient(135deg,var(--navy) 0%,#1a3d8f 100%);color:#fff;border:none;border-radius:13px;
    padding:14px;font-size:.95rem;font-weight:800;cursor:pointer;margin-top:6px;letter-spacing:.02em;
    box-shadow:0 10px 24px -8px rgba(9,45,116,.55);
  }
  .login-btn:hover{filter:brightness(1.06);}
  .login-info-box{
    margin-top:20px;background:var(--navy-dim);border:1px dashed var(--navy);border-radius:12px;
    padding:12px 14px;text-align:left;
  }
  .login-info-box .title{font-weight:800;color:var(--navy);font-size:.8rem;margin-bottom:5px;}
  .login-info-box .line{font-size:.78rem;line-height:1.6;}
  .login-info-box .line .k{color:var(--text-dim);}
  .login-info-box .line.user b{color:var(--navy);}
  .login-info-box .line.pass b{color:var(--success);}
  .login-page-footer{text-align:center;padding:16px 10px 20px;color:rgba(255,255,255,.55);font-size:.74rem;}
  .login-page-footer b{color:rgba(255,255,255,.85);}
  footer.app-footer{
    text-align:center; padding:16px 10px 18px; color:var(--gray); font-size:.75rem; border-top:1px solid var(--border); margin-top:20px;
  }
  footer.app-footer b{color:var(--navy);}
  .footer-space{height:6px;}
  .add-form{border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:8px;}
  .userlist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .userlist-row:last-child{border-bottom:none;}
  .userlist-row .u-name{font-weight:700;font-size:.88rem;}
  .userlist-row .u-role{font-size:.72rem;color:var(--text-dim);}
  .prod-thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;display:block;}
  .prod-thumb-ph{
    width:52px;height:52px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--text-dim);flex-shrink:0;
  }
  .prod-thumb-lg{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;display:block;}
  .prod-thumb-ph-lg{
    width:64px;height:64px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--text-dim);flex-shrink:0;
  }
  .img-controls{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .requester-box{
    background:var(--navy-dim);border:1px solid var(--border);border-radius:10px;padding:10px 14px;
    display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:6px;
  }
  .requester-box .who{font-weight:800;color:var(--navy);}
  .import-box textarea{
    width:100%;min-height:110px;background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:9px 10px;font-size:.82rem;font-family:inherit;resize:vertical;
  }
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<!-- ==================================================================
     LOGIN PAGE
     แก้ไขหน้านี้ได้อิสระ — ข้อความ, โลโก้, สี, เลย์เอาต์ ปรับได้ตรงนี้เลย
     (สไตล์ .login-* ทั้งหมดอยู่ใน <style> ด้านบนของไฟล์นี้)
     JS จะแสดง/ซ่อน div นี้เอง (ดูฟังก์ชัน render() ใน app.js) — ไม่ต้องลบ id ต่างๆ
     ================================================================== -->
<div id="loginPage" class="login-page" style="display:none;">
  <div class="login-wrap">
    <div class="login-card">

      <!-- โลโก้: มาจากไฟล์ index.html เอง (ฝังเป็น base64 ในสคริปต์ logo-data ด้านล่าง) -->
      <img id="loginLogo" src="" alt="Bangkok Hospital Samui">

      <!-- หัวข้อภาษาอังกฤษ -->
      <h2>Non Inventory System</h2>
      <!-- หัวข้อรอง ภาษาไทย -->
      <p class="sub">ระบบเบิกของใช้ฟุ่มเฟือย</p>

      <div class="login-divider"></div>

      <!-- กล่องข้อความ error เมื่อล็อกอินผิด — ซ่อนอยู่จนกว่าจะมีข้อความ -->
      <div id="loginErrorBox" class="login-err" style="display:none;"></div>

      <!-- ช่องกรอกชื่อผู้ใช้ -->
      <div class="login-field">
        <label for="loginUser">ชื่อผู้ใช้ / Username</label>
        <input type="text" id="loginUser" placeholder="กรอกชื่อผู้ใช้" autocomplete="username">
      </div>

      <!-- ช่องกรอกรหัสผ่าน -->
      <div class="login-field">
        <label for="loginPass">รหัสผ่าน / Password</label>
        <input type="password" id="loginPass" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
      </div>

      <!-- ปุ่มเข้าสู่ระบบ -->
      <button type="button" class="login-btn" id="loginSubmitBtn">เข้าสู่ระบบ</button>

      <!-- กล่องคำแนะนำบัญชีทดลอง — ลบ div นี้ทิ้งได้เลยถ้าไม่ต้องการให้แสดง -->
      <div class="login-info-box">
        <div class="title">การเข้าใช้งาน</div>
        <div class="line user"><span class="k">Username : </span><b>รหัสพนักงาน</b></div>
        <div class="line pass"><span class="k">Password : </span><b>รหัสพนักงาน</b></div>
      </div>

    </div>
  </div>

  <!-- ฟุตเตอร์หน้า login -->
  <div class="login-page-footer">
    <div>BSH Non Inventory</div>
    <div>Developed by <b>Pratthana J.C.</b></div>
  </div>
</div>
<!-- ================== END LOGIN PAGE ================== -->

<div id="app" style="display:none;">
  <div style="padding:60px 0;text-align:center;color:var(--text-dim);">กำลังโหลด...</div>
</div>

<!-- ==================================================================
     FOOTER — แสดงท้ายทุกหน้าหลังล็อกอิน (ทุกแท็บใช้อันเดียวกันนี้)
     แก้ข้อความ/ลิงก์/สไตล์ได้อิสระตรงนี้เลย ไม่ต้องแตะ app.js
     สไตล์ .app-footer อยู่ใน <style> ด้านบนของไฟล์นี้ (ค้นหา "app-footer")
     ================================================================== -->
<footer id="appFooter" class="app-footer" style="display:none;">
  <div>BSH Non Inventory</div>
  <div>Developed by <b>Pratthana J.C.</b></div>
